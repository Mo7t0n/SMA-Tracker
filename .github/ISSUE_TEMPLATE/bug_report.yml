name: Bug report
description: Something in the integration or its notifications doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Shown in HACS, or under Settings → Devices & services → SMA Tracker.
      placeholder: v0.2.4
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected part
      options:
        - Setup / options (config flow)
        - Sensor value or attributes
        - Daily notification
        - Other
    validations:
      required: true
  - type: textarea
    id: tracker-config
    attributes:
      label: Tracker configuration
      description: Yahoo Finance symbol, SMA period, update interval and — for notification issues — notification time and service.
      placeholder: |
        Symbol: ^GDAXI
        SMA period: 200
        Update interval: 60
        Notification: 22:00 via notify.pushover
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from Settings → System → Logs (search for `sma_tracker`).
      render: text
